# 로컬 클러스터(Docker Desktop / kind / minikube)용. 적용: kubectl apply -f serving/k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmde-serving
spec:
  replicas: 1
  selector:
    matchLabels: {app: mmde-serving}
  template:
    metadata:
      labels: {app: mmde-serving}
    spec:
      containers:
        - name: api
          image: mmde-serving:dev
          imagePullPolicy: IfNotPresent  # 로컬에서 빌드한 이미지 사용
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: mmde-serving
spec:
  type: NodePort
  selector: {app: mmde-serving}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
